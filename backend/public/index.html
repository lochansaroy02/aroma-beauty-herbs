<!doctype html>
<!--
  Vercel requires an output directory whenever a build command is defined, and
  an API produces no static output. This file is that directory's entire
  contents. The filesystem is checked before vercel.json's rewrites, so it
  answers "/" and nothing else — every other path reaches the function.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Aroma Beauty Herbs API</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
      p { margin: 0; opacity: 0.7; font-size: 0.9375rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>Aroma Beauty Herbs API</h1>
    <p>This host serves the API only. The storefront lives elsewhere.</p>
    <p><a href="/health">/health</a></p>
  </body>
</html>
